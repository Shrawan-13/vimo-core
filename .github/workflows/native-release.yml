name: Native release

# Builds the Android native libraries and publishes them as a release asset.
#
# The Vimo app does not contain any Rust: it downloads this artifact at build
# time. That keeps the app repository small and means the native code is
# built and tested in one place.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "The version to publish (for example 0.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the native libraries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use the XDG base directories
        shell: bash
        run: |
          # Everything that is a cache lives under one predictable root
          # instead of a dot-folder in the home directory.
          export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
          echo "XDG_CACHE_HOME=$XDG_CACHE_HOME" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$XDG_CACHE_HOME/cargo" >> "$GITHUB_ENV"
          echo "$XDG_CACHE_HOME/cargo/bin" >> "$GITHUB_PATH"

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache the cargo registry and the build directory
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: native-${{ runner.os }}-${{ steps.version.outputs.version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            native-${{ runner.os }}-${{ steps.version.outputs.version }}-

      - name: Cache the cargo binaries
        uses: actions/cache@v6
        with:
          path: ${{ env.CARGO_HOME }}/bin
          key: cargo-bin-${{ runner.os }}

      - name: Set up the NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # The NDK is a large download, so it is cached as well.
      - name: Cache the NDK
        uses: actions/cache@v6
        with:
          path: ${{ steps.ndk.outputs.ndk-path }}
          key: ndk-27.2.12479018-${{ runner.os }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # The shim has to exist before the Rust libraries are built: they link
      # against it.
      - name: Build the Oboe shim
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S cpp -B "build/oboe/$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_LIBRARY_OUTPUT_DIRECTORY="$PWD/build/native/jniLibs/$ABI" \
              >/dev/null
            cmake --build "build/oboe/$ABI" --config Release -j2 >/dev/null
          done
          find build/native/jniLibs -name "*.so" | sort

      - name: Build the Rust libraries
        env:
          VIMO_NATIVE_LIB_DIR: ${{ github.workspace }}/build/native/jniLibs
        run: |
          cargo ndk \
            -t arm64-v8a \
            -t armeabi-v7a \
            -t x86_64 \
            -o build/native/jniLibs \
            build --release \
            -p vimo-jni

      - name: Collect the assets
        run: |
          mkdir -p build/native/assets/vimo/manifests build/native/assets/vimo/shaders
          cp assets/manifests/*.json build/native/assets/vimo/manifests/
          cp assets/shaders/*.frag build/native/assets/vimo/shaders/

      - name: Write the checksums
        shell: bash
        run: |
          cd build/native
          find . -type f ! -name checksums.txt -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      - name: Pack the artifact
        run: |
          cd build/native
          zip -r "../vimo-native-${{ steps.version.outputs.version }}-android.zip" .
          cd ..
          sha256sum "vimo-native-${{ steps.version.outputs.version }}-android.zip" \
            > "vimo-native-${{ steps.version.outputs.version }}-android.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > build/release-notes.md <<'NOTES'
          The Android native libraries for the Vimo app.

          Unpack the zip: the `jniLibs` folder goes into the APK, the `assets`
          folder holds the effect manifest and the shaders.

          Verify the download with the `.sha256` file next to it.
          NOTES
          gh release create "v${{ steps.version.outputs.version }}" \
            "build/vimo-native-${{ steps.version.outputs.version }}-android.zip" \
            "build/vimo-native-${{ steps.version.outputs.version }}-android.zip.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Vimo native ${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md

  prune-caches:
    name: Prune old Actions caches
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      # Keep the cache count bounded: the twenty newest are almost always the
      # useful ones, and an unbounded cache eventually fills the runner's disk.
      - name: Keep the 20 newest repository caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          mapfile -t stale_ids < <(
            gh api --paginate "repos/${REPOSITORY}/actions/caches?per_page=100" \
              --jq '.actions_caches[] | [.id, .created_at] | @tsv' \
              | sort -k2,2r \
              | awk 'NR > 20 { print $1 }'
          )
          for cache_id in "${stale_ids[@]}"; do
            gh api --silent --method DELETE "repos/${REPOSITORY}/actions/caches/${cache_id}"
          done
